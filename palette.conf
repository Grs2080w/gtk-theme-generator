# own-theme palette. Edit the colors, then run: ./install.sh --apply
# These defaults reproduce Zorin OS's ZorinBlue-Dark exactly.
# Ready-made palettes live in examples/; the visual editor is editor/index.html.
name = ZorinCustom-Dark

background = #222b30   # window background; every other dark tone derives from it
accent     = #bde6fb   # selection, suggested buttons, focus, switches, sliders
text       = #bde6fb   # main text
text_on_accent = auto  # text on top of the accent; auto = dark or white

error      = #fb7c7c
warning    = #faa483
success    = #6ee1b6

radius     = 1.0       # rounded corners multiplier (0 = square, 1 = original)

# glass: below 1 the background is translucent; blur = yes turns on Blur my Shell for apps
# blur_mode: static (wallpaper, rounded corners) | dynamic (everything behind, square corners on GNOME 46)
window_opacity  = 1
content_opacity = 1
blur            = no
blur_strength   = 30
blur_mode       = static

# window buttons: zorin | circles | plain
buttons         = zorin
glyphs          = lines
symbols         = hover
button_size     = 18
button_close    = auto
button_maximize = auto
button_minimize = auto
# custom icons: path relative to this folder (no spaces) or none
icon_close      = none
icon_maximize   = none
icon_minimize   = none
icon_restore    = none
