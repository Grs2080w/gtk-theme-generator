# Gerado no Estúdio Zorin Dark — na pasta own-theme rode: ./instalar.sh --aplicar
nome = ZorinCustom-Dark

fundo    = #0b0b0c
destaque = #0b1727
texto    = #e4eaf1
texto_sobre_destaque = auto

erro     = #d46868
aviso    = #d48868
sucesso  = #67c19e

raio     = 1.0

# vidro: abaixo de 1 o fundo fica translúcido; blur = sim liga o Blur my Shell nos apps
# blur_modo: estatico (papel de parede, cantos redondos) | dinamico (tudo atrás, cantos retos no GNOME 46)
opacidade_janela   = 0.3
opacidade_conteudo = 1
blur               = sim
blur_forca         = 100
blur_modo          = estatico

# botões da janela: zorin | circulos | simples
botoes          = circulos
glifos          = linhas
simbolos        = nunca
botao_tamanho   = 16
botao_fechar    = auto
botao_maximizar = auto
botao_minimizar = auto
# ícones próprios: caminho relativo a esta pasta (sem espaços) ou nenhum
icone_fechar    = nenhum
icone_maximizar = nenhum
icone_minimizar = nenhum
icone_restaurar = nenhum
