# macOS-style glass: translucent windows, blur, traffic-light buttons
# Usage: ./install.sh --apply examples/macos-glass.conf
# Options not listed here keep their defaults (see palette.conf).
name = MacGlass-Dark

background      = #1c1c1e
accent          = #0a84ff
text            = #f2f2f7
error           = #ff453a
warning         = #ff9f0a
success         = #30d158
radius          = 1.2
window_opacity  = 0.8
content_opacity = 0.85
blur            = yes
blur_strength   = 40
buttons         = circles
glyphs          = mac
symbols         = hover
button_size     = 16
button_close    = #ff5f57
button_maximize = #28c840
button_minimize = #febc2e
