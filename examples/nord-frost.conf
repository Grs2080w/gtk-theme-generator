# Nord with frosted glass and plain buttons
# Usage: ./install.sh --apply examples/nord-frost.conf
# Options not listed here keep their defaults (see palette.conf).
name = NordFrost-Dark

background      = #2e3440
accent          = #88c0d0
text            = #eceff4
error           = #bf616a
warning         = #d08770
success         = #a3be8c
window_opacity  = 0.82
content_opacity = 0.9
blur            = yes
blur_strength   = 35
buttons         = plain
glyphs          = arrows
button_size     = 20
