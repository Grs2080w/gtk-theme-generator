# Minimal: almost square corners, monochrome, plain buttons
# Usage: ./install.sh --apply examples/minimal-square.conf
# Options not listed here keep their defaults (see palette.conf).
name = MinimalSquare-Dark

background  = #161616
accent      = #e0e0e0
text        = #e0e0e0
radius      = 0.3
buttons     = plain
button_size = 20
