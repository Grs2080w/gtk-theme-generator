# Catppuccin Mocha with glass and circle buttons
# Usage: ./install.sh --apply examples/catppuccin-glass.conf
# Options not listed here keep their defaults (see palette.conf).
name = CatppuccinGlass-Dark

background      = #1e1e2e
accent          = #cba6f7
text            = #cdd6f4
error           = #f38ba8
warning         = #fab387
success         = #a6e3a1
radius          = 1.2
window_opacity  = 0.75
content_opacity = 0.85
blur            = yes
blur_strength   = 45
buttons         = circles
glyphs          = lines
symbols         = hover
button_size     = 16
