# OLED black with very transparent windows, strong blur and dotless circle buttons
# Usage: ./install.sh --apply examples/oled-glass.conf
# Options not listed here keep their defaults (see palette.conf).
name = OledGlass-Dark

background     = #0b0b0c
accent         = #0b1727
text           = #e4eaf1
error          = #d46868
warning        = #d48868
success        = #67c19e
window_opacity = 0.3
blur           = yes
blur_strength  = 100
buttons        = circles
symbols        = never
button_size    = 16
